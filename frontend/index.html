<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/icone.ico" type="image/x-icon">
    <title>VibeBook.com</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <h1>VibeBook</h1> 
    <h2>Já possui uma conta?</h2>
    <a href="pag-login.html">Clique aqui para realizar o Login</a>
    
    <h2>Crie uma conta</h2>


    <form id="cadastroForm">
        
        <label for="usuario">Digite seu usuario: </label>
        <br><br> 
        <input required type="text" id="usuario" name="usuario" placeholder="digite aqui...">
       
        <p><label for="email">Digite seu email: </label></p>
        <input required type="email" id="email" name="email" placeholder="digite aqui...">

        <div>
            <p><label for="senha">Crie uma senha:</label></p>
            <input required type="password" id="senha" name="senha" placeholder="sua senha aqui..">
        </div>
          
        <div>
            <p><label for="ConfirmarSenha">Confirme sua senha:</label></p>
            <input required type="password" id="ConfirmarSenha" name="confirmarSenha" placeholder="Confirmação aqui..">
        </div>
        
        <br> 

        <img src="imagens/icone.ico" alt="Logo">
     
        <div class="button">
            <p>
                <button type="submit" class="botao1">Cadastrar</button>
            </p>
        </div>
        
    </form>

    

</body>
</html>
