<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/icone.ico" type="image/x-icon">
    <title>VibeBook</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>

    <!-- Container centralizado no estilo do login do Instagram -->
    <div class="card card-home">
        
        <!-- Header com Logo -->
        <header class="brand-header">
            <img src="imagens/icone.ico" alt="Logo VibeBook" class="logo-img">
            <h1 class="logo-text">VibeBook</h1>
        </header>

        <p class="sub-texto">Conecte-se com amigos, compartilhe momentos reais e viva novas vibes.</p>

        <!-- Seção de Recursos -->
        <div class="sobre-rede">
            <div class="info-item">
                <span class="info-icone"></span>
                <p><strong>Comunidade Ativa:</strong> Encontre pessoas com os mesmos interesses.</p>
            </div>
            <div class="info-item">
                <span class="info-icone"></span>
                <p><strong>Feed Autêntico:</strong> Um ambiente leve e focado no essencial.</p>
            </div>
        </div>

        <!-- Botões de Ação -->
        <div class="acoes-home">
            <a href="pag-login.html" class="botao">Entrar</a>
            <a href="pag-cadastro.html" class="botao botao-secundario">Criar nova conta</a>
        </div>

    </div>

    <!-- Rodapé de Créditos em Destaque na PG Principal -->
    <footer class="creditos-footer">
        <p>Desenvolvido por: <strong>Davi Ribeiro Santos Faria</strong> e <strong>Miguel Lucieto</strong></p>
    </footer>

</body>
</html>
