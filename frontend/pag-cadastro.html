<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeBook.com/cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Caixa principal que organiza tudo e centraliza no meio da tela -->
    <div class="card">
        
        <h1>VibeBook</h1>
        <h2>Crie uma conta</h2>

        <form id="cadastroForm">
            
            <div class="input-group">
                <span class="icon">👤</span>
                <label for="usuario">Digite seu usuário:</label>
                <input required type="text" id="usuario" name="usuario" placeholder="digite aqui...">
            </div>

            <div class="input-group">
                <span class="icon">✉️</span>
                <label for="email">Digite seu email:</label>
                <input required type="email" id="email" name="email" placeholder="digite aqui...">
            </div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <label for="senha">Crie uma senha:</label>
                <input required type="password" id="senha" name="senha" placeholder="sua senha aqui...">
            </div>
            
            <div class="input-group">
                <span class="icon">🔒</span>
                <label for="ConfirmarSenha">Confirme sua senha:</label>
                <input required type="password" id="ConfirmarSenha" name="ConfirmarSenha" placeholder="confirmação aqui...">
            </div>
            
            <div class="button">
                <button type="submit" class="botao">Cadastrar</button>
            </div>

        </form>

        <img src="imagens/icone.ico" alt="Logo">

        <div class="voltar">
            <h2>Voltar à Página Principal</h2>
            <a href="index.html">Clique aqui para ir para a página principal</a>
        </div>

    </div>

</body>
</html>s
