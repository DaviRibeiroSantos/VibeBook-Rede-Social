<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeBook.com/cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>VibeBook</h1>
        <h2>Crie uma conta</h2>
<form id="cadastroForm">
    <label for="usuario">Digite seu usuario: </label>
    <br><br>
    <input required type="text" id="usuario" name="usuario" placeholder="digite aqui...">
    
    <p><label for="email">Digite seu email: </label></p>
    <input required type="email" id="email" name="email" placeholder="digite aqui...">

    <div>
        <p><label for="senha">Crie uma senha:</label></p>
        <input required type="password" id="senha" placeholder="sua senha aqui..">
    </div>
      
    <div>
        <p><label for="ConfirmarSenha">Confirme sua senha:</label></p>
        <input required type="password" id="ConfirmarSenha" placeholder="Confirmaçao aqui..">
    </div>
    
</form>


   

        <img src="imagens/icone.ico" alt="Logo">
     
        <div class="button">
            <p>
                <button type="submit" class="botao">Cadastrar</button>
            </p>
        </div>
        
    </form>
  <br> <br>
    <div>
        <p>
             <h3>Voltar a Pagina Principal</h3>
    <a href="index.html">Clique aqui para ir para a pagina Principal<p>
        </p>
    </div>

    
</body>
</html>
