<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeBook.com/login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Caixa principal que organiza tudo e centraliza no meio da tela -->
    <div class="card">
        
        <h1>Login</h1>

        <form id="LoginForm">
            <div class="input-group">
                <span class="icon"></span>
                <label for="usuario">Digite seu Usuário:</label>
                <input required type="text" id="usuario" name="usuario" placeholder="digite aqui...">
            </div>

            <div class="input-group">
                <span class="icon"></span>
                <label for="senha">Digite sua senha:</label>
                <input required type="password" id="senha" name="senha" placeholder="digite aqui...">
            </div>

            <div class="button">
                <button type="submit" class="botao">Logar</button>
            </div>
        </form>

        <img src="imagens/icone.ico" alt="Ícone">

        <div class="voltar">
            <h2>Voltar à Página Principal</h2>
            <a href="index.html">Clique aqui para ir para a página principal</a>
        </div>

    </div>

</body>
</html>
